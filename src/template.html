<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="output.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen pb-20 bg-slate-800">
    <p
      class="text-slate-300 text-3xl font-elms-sans font-bold flex justify-center"
    >
      VibeCast
    </p>

    <form id="search-form" class="flex justify-center mt-3">
      <input
        id="search-bar"
        type="text"
        placeholder="Enter a City!"
        class="text-slate-300 bg-slate-800 px-3 py-1 rounded-md mr-2"
      />
      <button
        type="submit"
        id="submit-btn"
        class="text-white hover:bg-slate-700 bg-slate-300 box-border border font-medium leading-5 rounded-base text-sm px-4 py-1.5"
      >
        Submit
      </button>
    </form>

    <div id="results-container" class="flex justify-center mt-3">
      <p class="text-emerald-300 text-lg font-semibold">
        Search a city to see Results!
      </p>
    </div>

    <div id="symbol-img" class="flex justify-center mt-3">
      <img src="imgs/symbol-modified.png" class="w-34 h-auto" />
    </div>

    <div id="future-dates"></div>

    <footer
      class="absolute bottom-0 left-0 w-full flex justify-center items-center gap-4 text-slate-400 p-4"
    >
      <p>
        Copyright &copy;
        <script>
          document.write(new Date().getFullYear());
        </script>
        Tony Li
      </p>
      <a href="https://github.com/TonyLi0916" target="_blank">
        <img
          class="w-10 transition-transform duration-300 ease-in-out hover:rotate-360 invert"
          src="imgs/github-mark-copy.svg"
        />
      </a>
    </footer>
  </body>
</html>
